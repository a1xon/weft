<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF · weft</title>
<style>
  :root { --bg: #20252d; --bar: #090d14; --line: #1c2735; --fg: #cfe3f5; --dim: #7f93ab; --accent: #5cc8ff; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font: 12px/1.45 ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 38px; z-index: 10; display: flex; align-items: center; gap: 8px;
    padding: 0 10px; background: #090d14f2; border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
  #bar .logo { color: var(--accent); font-weight: 700; letter-spacing: .04em; flex: none; }
  #name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #e8f4ff; }
  #at { color: var(--dim); flex: none; }
  #bar .sp { flex: 1; }
  button { font: inherit; color: var(--fg); background: #0e1520; border: 1px solid #263547; border-radius: 4px;
    padding: 3px 9px; cursor: pointer; flex: none; }
  button:hover { border-color: var(--accent); }
  #zoom { min-width: 58px; }
  #mark { background: var(--accent); color: #04121c; border-color: var(--accent); font-weight: 700; }
  kbd { font: inherit; opacity: .7; font-size: 10px; }
  #pages { padding: 52px 12px 40px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .pg { position: relative; flex: none; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.45);
    --scale-round-x: 1px; --scale-round-y: 1px; --total-scale-factor: var(--scale-factor); }
  .pg canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .para, .ln { position: absolute; pointer-events: none; }
  #msg { position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px));
    padding: 16px 18px; background: var(--bar); border: 1px solid #2b3a4f; border-radius: 8px; color: #9fb3c8; text-align: center; }
  #msg.err { color: #ffb86b; }
  #msg code { color: #e8f4ff; background: #05080d; padding: 0 4px; border-radius: 3px; }
  #msg button { margin-top: 12px; }

  /* PDF.js's text layer (from its pdf_viewer.css): the text, invisible, over the drawn page */
  .textLayer { color-scheme: only light; position: absolute; text-align: initial; inset: 0; overflow: clip; opacity: 1; line-height: 1;
    letter-spacing: normal; word-spacing: normal; text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0;
    caret-color: CanvasText; z-index: 0;
    --min-font-size: 1; --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size)); --min-font-size-inv: calc(1 / var(--min-font-size)); }
  .textLayer :is(span, br) { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; user-select: text; }
  .textLayer > :not(.markedContent), .textLayer .markedContent span:not(.markedContent) { z-index: 1; --font-height: 0;
    font-size: calc(var(--text-scale-factor) * var(--font-height)); --scale-x: 1; --rotate: 0deg;
    transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv)); }
  .textLayer .markedContent { display: contents; }
  .textLayer span[role="img"] { user-select: none; cursor: default; }
  .textLayer ::selection { background: color-mix(in srgb, AccentColor, transparent 50%); color: transparent; }
  .textLayer br::selection { background: transparent; }
  .textLayer .endOfContent { display: block; position: absolute; inset: 100% 0 0; z-index: 0; cursor: default; user-select: none; }
</style>
</head>
<body>
<header id="bar">
  <span class="logo">◇ weft</span>
  <span id="name"></span>
  <span id="at"></span>
  <span class="sp"></span>
  <button id="out" title="zoom out (ctrl −)">−</button>
  <button id="zoom" title="fit width (ctrl 0)">100%</button>
  <button id="in" title="zoom in (ctrl +)">+</button>
  <button id="mark" title="mark a line, paragraph or area for weft">mark <kbd>Alt+Shift+W</kbd></button>
</header>
<main id="pages"></main>
<div id="msg" hidden></div>
<script type="module" src="viewer.js"></script>
</body>
</html>
